name: Build DFRoot APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout DFRoot source
        uses: actions/checkout@v7
        with:
          repository: diabl0w/DFRoot
          ref: master
          path: DFRoot

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Align Gradle and Android plugin versions
        working-directory: DFRoot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path("gradle/wrapper/gradle-wrapper.properties")
          text = wrapper.read_text()

          text = re.sub(
              r"gradle-[0-9.]+-bin\.zip",
              "gradle-8.11.1-bin.zip",
              text,
          )

          wrapper.write_text(text)

          for filename in (
              "build.gradle.kts",
              "gradle/libs.versions.toml",
          ):
              path = Path(filename)

              if path.exists():
                  path.write_text(
                      path.read_text().replace(
                          '"8.7.3"',
                          '"8.10.1"',
                      )
                  )
          PY

      - name: Build release APK
        working-directory: DFRoot
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          cp \
            DFRoot/app/build/outputs/apk/release/dirtyfrag.apk \
            DFRoot.apk

          ls -lh DFRoot.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: DFRoot-APK
          path: DFRoot.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Delete existing nightly asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset nightly DFRoot.apk \
            --repo "${{ github.repository }}" \
            --yes || true

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit nightly \
              --repo "${{ github.repository }}" \
              --title "DFRoot Nightly" \
              --notes "Latest automatic DFRoot build from bygalacos/DFRoot."
          else
            gh release create nightly \
              DFRoot.apk \
              --repo "${{ github.repository }}" \
              --title "DFRoot Nightly" \
              --notes "Latest automatic DFRoot build from bygalacos/DFRoot." \
              --prerelease
          fi

      - name: Upload APK to nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload nightly \
            DFRoot.apk \
            --repo "${{ github.repository }}" \
            --clobber
