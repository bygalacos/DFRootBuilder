name: Build DFRoot APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout DFRoot source
        uses: actions/checkout@v7
        with:
          repository: diabl0w/DFRoot
          path: DFRoot

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Align Gradle and Android plugin versions
        working-directory: DFRoot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path("gradle/wrapper/gradle-wrapper.properties")
          wrapper.write_text(re.sub(
              r"gradle-[0-9.]+-bin\.zip",
              "gradle-8.11.1-bin.zip",
              wrapper.read_text(),
          ))

          for filename in ("build.gradle.kts", "gradle/libs.versions.toml"):
              path = Path(filename)
              path.write_text(path.read_text().replace('"8.7.3"', '"8.10.1"'))
          PY

      - name: Build DFRoot APK
        working-directory: DFRoot
        run: |
          chmod +x gradlew build.sh
          ./build.sh

      - name: Prepare APK
        id: apk
        run: |
          SHA=$(git -C DFRoot rev-parse --short=8 HEAD)
          APK="DFRoot-${SHA}.apk"
          cp DFRoot/dirtyfrag.apk "$APK"
          echo "filename=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: DFRoot-APK
          path: ${{ steps.apk.outputs.filename }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1; then
            gh release edit nightly \
              --repo "${{ github.repository }}" \
              --title "DFRoot Nightly" \
              --notes "Latest automatic build from diabl0w/DFRoot."
          else
            gh release create nightly \
              --repo "${{ github.repository }}" \
              --title "DFRoot Nightly" \
              --notes "Latest automatic build from diabl0w/DFRoot." \
              --prerelease
          fi
      - name: Upload APK to nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload nightly \
            "${{ steps.apk.outputs.filename }}" \
            --repo "${{ github.repository }}" \
            --clobber
